<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>__TITLE__</title>
<style>
  @page { size: letter; margin: 0.85in 0.95in 0.8in 0.95in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; font-size: 9.6pt;
         color: #000; -webkit-print-color-adjust: exact; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .cover { height: 8.4in; display: flex; flex-direction: column; justify-content: center;
           align-items: center; text-align: center; }
  .cover div { font-weight: bold; font-size: 12pt; line-height: 2.1; }
  h1 { font-size: 10pt; font-weight: bold; margin: 0 0 2pt 0; line-height: 1.25; max-width: 3.6in; }
  .unaud { font-size: 10pt; font-weight: bold; margin: 0 0 14pt 0; }
  .units { font-style: italic; font-size: 9pt; }
  table { width: 100%; border-collapse: collapse; }
  col.lab { width: auto; } col.fig { width: 1.05in; } col.gap { width: 0.18in; }
  th.hd { font-size: 9.2pt; font-weight: bold; text-align: center; vertical-align: bottom;
          padding-bottom: 1pt; line-height: 1.15; }
  th.hd span { display: block; }
  th.hd .yr { border-bottom: 1px solid #000; padding-bottom: 1pt; }
  td { padding: 1.05pt 0; vertical-align: bottom; }
  td.f { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.f .s { float: left; }
  tr.h td { font-weight: bold; padding-top: 5pt; }
  tr.h2 td { padding-left: 0.10in; }
  tr.d td.l { padding-left: 0.22in; }
  tr.sub td.l { padding-left: 0.44in; }
  tr.sub td.f { border-top: 1px solid #000; }
  tr.tot td.l { padding-left: 0.44in; font-weight: normal; }
  tr.tot td.f { border-top: 1px solid #000; border-bottom: 3px double #000; padding-bottom: 1pt; }
  tr.note td { padding-left: 0.10in; padding-top: 3pt; }
  .foot { margin-top: 26pt; font-size: 8.6pt; }
</style></head><body>
<!--BODY-->
</body></html>
