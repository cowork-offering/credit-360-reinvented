<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>__TITLE__</title>
<style>
  @page { size: letter; margin: 0.9in 1in 0.75in 1in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Times New Roman", "Liberation Serif", Times, serif; font-size: 11pt;
         color: #000; -webkit-print-color-adjust: exact; }
  .page { page-break-after: always; min-height: 8.6in; display: flex; flex-direction: column; }
  .page:last-child { page-break-after: auto; }
  .cover { flex: 1; display: flex; flex-direction: column; justify-content: center;
           align-items: center; text-align: center; }
  .cover .nm { font-size: 15pt; letter-spacing: .06em; font-weight: bold; margin-bottom: 44pt; }
  .cover .ti { font-size: 12.5pt; letter-spacing: .10em; margin-bottom: 10pt; }
  .cover .dt { font-size: 12.5pt; letter-spacing: .10em; }
  .ctr { text-align: center; }
  .sthead { text-align: center; line-height: 1.32; margin-bottom: 16pt; }
  .sthead .e { font-weight: bold; letter-spacing: .04em; }
  .sthead .t { letter-spacing: .04em; }
  .sthead .r { font-size: 10pt; }
  h2.rep { text-align: center; font-size: 11pt; font-weight: bold; letter-spacing: .03em;
           margin: 0 0 30pt 0; }
  h3 { font-size: 11pt; font-weight: bold; letter-spacing: .02em; margin: 16pt 0 7pt 0; }
  h4 { font-size: 11pt; font-weight: bold; margin: 9pt 0 3pt 0; }
  p { margin: 0 0 8pt 0; text-align: justify; line-height: 1.35; }
  table { width: 100%; border-collapse: collapse; }
  col.fig { width: 1.22in; } col.gap { width: 0.20in; }
  th.hd { font-size: 10.5pt; font-weight: bold; text-align: center; vertical-align: bottom;
          padding-bottom: 2pt; }
  th.hd span { border-bottom: 1px solid #000; padding: 0 4pt 1pt 4pt; display: inline-block;
               min-width: 0.9in; }
  td { padding: 1.1pt 0; vertical-align: bottom; }
  td.f { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.f .s { float: left; }
  tr.h td { font-weight: bold; letter-spacing: .03em; padding-top: 8pt; }
  tr.h2 td { padding-left: 0.12in; font-weight: bold; padding-top: 6pt; }
  tr.d td.l { padding-left: 0.22in; }
  tr.sub td.l { padding-left: 0.40in; letter-spacing: .02em; }
  tr.sub td.f { border-top: 1px solid #000; }
  tr.tot td.l { padding-left: 0.40in; letter-spacing: .02em; }
  tr.tot td.f { border-top: 1px solid #000; border-bottom: 3px double #000; padding-bottom: 1pt; }
  tr.note td { padding-left: 0.12in; padding-top: 4pt; font-style: italic; }
  .pagefoot { margin-top: auto; padding-top: 18pt; }
  .pfoot { text-align: center; font-size: 10pt; }
  .pnum { margin-top: 12pt; text-align: center; font-size: 10pt; }
  .toc td { padding: 4.5pt 0; }
  .toc td.p { text-align: right; width: 0.7in; }
  .toc td.l2 { padding-left: 0.22in; }
  .sig { margin: 34pt 0 0 0; font-style: italic; font-size: 13pt; }
  .letterhead { text-align: center; border-bottom: 1.5px solid #000; padding-bottom: 8pt;
                margin-bottom: 26pt; }
  .letterhead .fn { font-size: 16pt; letter-spacing: .10em; font-weight: bold; }
  .letterhead .fs { font-size: 8.5pt; letter-spacing: .22em; margin-top: 3pt; }
  .addr { margin-bottom: 22pt; line-height: 1.35; }
  .nt table { margin: 6pt 0 10pt 0; }
  .nt table.tc { margin: 0; }
  .nt table.tc-first { margin-top: 6pt; }
  .nt table.tc-last { margin-bottom: 10pt; }
  .nt td.l { padding-left: 0.22in; }
  .nt td.l0 { padding-left: 0; }
  small { font-size: 9.5pt; }
</style></head><body>
<!--BODY-->
</body></html>
